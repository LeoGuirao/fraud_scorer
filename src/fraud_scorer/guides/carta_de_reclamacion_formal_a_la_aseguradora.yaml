metadata:
  type: carta_de_reclamacion_formal_a_la_aseguradora
  version: "2.0"
  author: "Equipo Fraude HDI"
  last_updated: "2025-03-10"
  description: "Guía renovada para evaluar cartas formales de reclamación considerando validaciones cruzadas críticas y narrativa estandarizada"

definition:
  nature: "Comunicación formal mediante la cual el asegurado o un asegurado adicional solicita la indemnización derivada de un siniestro"
  legal_importance: "Alta: establece monto reclamado, hechos, lugar del siniestro y responsabilidad contractual de la aseguradora"
  critical_elements:
    - emisor_carta
    - asegurado_principal
    - asegurados_adicionales
    - numero_siniestro
    - numero_poliza
    - fecha_ocurrencia
    - fecha_carta
    - lugar_siniestro
    - descripcion_evento
    - monto_reclamado
    - bienes_afectados
    - documentos_soporte
    - firma_y_poder

methodology:
  analysis_approach: |
    1. Confirmar integridad documental (datos del emisor, destinatario, membrete, firma, relación de anexos).
    2. Verificar coherencia temporal entre la fecha de ocurrencia y la fecha de la carta; documentar el desfase en días.
    3. Validar que el número de póliza, el número de siniestro y el asegurado (o asegurado adicional) coinciden con la póliza vigente.
    4. Corroborar que el emisor de la carta está contemplado en la póliza (asegurado principal o adicional, o entidad listada como parte del grupo asegurado).
    5. Comparar los bienes y montos reclamados con lo declarado en denuncia, carpeta de investigación y reporte del ajustador (inicial/final).
    6. Identificar discrepancias materiales (montos, bienes, narrativas) y clasificarlas por nivel de riesgo.
    7. Registrar recomendaciones sólo cuando falte información para completar las verificaciones o correspondencias.

  fraud_indicators:
    high_risk:
      - pattern: emisor_no_en_poliza
        detection: "La entidad que emite la carta no figura como asegurado principal ni adicional, ni como integrante del grupo asegurado en la póliza"
        severity: "alto"
        evidence_hint: "Citar emisor vs. listado de asegurados en la póliza"
        follow_up: "Solicitar aclaración formal y documentación que acredite legitimación"
      - pattern: monto_reclamado_inconsistente
        detection: "Monto reclamado difiere significativamente del monto reportado por el ajustador (inicial o final)"
        severity: "critico"
        evidence_hint: "Citar ambos montos y porcentaje de diferencia"
        follow_up: "Requerir reconciliación de montos y soporte contable"
      - pattern: bienes_no_coinciden
        detection: "Bienes reclamados en la carta no guardan relación lógica con la pérdida descrita en denuncia/oficios"
        severity: "alto"
        evidence_hint: "Comparar conceptos reclamados vs. narrativas externas"
        follow_up: "Solicitar ampliación narrativa y documentación respaldatoria"
    medium_risk:
      - pattern: fechas_incoherentes
        detection: "La carta se emite antes del siniestro o la diferencia entre fecha de ocurrencia y carta excede plazos de aviso sin justificación"
        severity: "medio"
        evidence_hint: "Detallar fechas y días de diferencia"
        follow_up: "Documentar explicación del asegurado y validar registros de aviso"
      - pattern: poliza_o_siniestro_no_coinciden
        detection: "Número de póliza o siniestro difiere de los registros oficiales"
        severity: "medio"
        evidence_hint: "Citar valores contradictorios"
        follow_up: "Corroborar con sistemas internos y solicitar corrección"
      - pattern: anexos_no_acreditados
        detection: "La carta menciona anexos esenciales que no están en el expediente digital"
        severity: "medio"
        evidence_hint: "Listar anexos declarados vs. faltantes"
        follow_up: "Requerir envío de documentación faltante"
    low_risk:
      - pattern: narrativa_general
        detection: "La carta describe hechos coherentes pero omite detalle fino (hora, testigos, placas) sin afectar corroboraciones principales"
        severity: "bajo"
        evidence_hint: "Precisar elementos ausentes"
        follow_up: "Recomendar completar información para expediente"

  validation_rules:
    fecha_carta:
      type: pattern
      pattern: '^(19|20)\d{2}-\d{2}-\d{2}$'
    fecha_ocurrencia:
      type: pattern
      pattern: '^(19|20)\d{2}-\d{2}-\d{2}$'
    numero_poliza:
      type: pattern
      pattern: "^[A-Z0-9-]{5,30}$"
    numero_siniestro:
      type: pattern
      pattern: "^[A-Z0-9-]{5,30}$"
    monto_reclamado:
      type: pattern
      pattern: '^\\$?\\s?[0-9]{1,3}(?:[,\\s]?[0-9]{3})*(?:\\.[0-9]{2})?\\s?(?:MXN|M\\.N\\.|MN)?$'

  cross_reference_documents:
    - poliza_de_la_aseguradora
    - denuncia_de_los_hechos
    - carpeta_de_investigacion
    - informe_final_del_ajustador
    - informe_inicial_del_ajustador
    - oficios_autoridad

  evidence_expectations:
    - "Póliza con listado de asegurados adicionales"
    - "Denuncia/Carpeta de investigación que describa bienes y modo del siniestro"
    - "Reportes del ajustador con monto reclamado por el asegurado"

  red_flags:
    critical:
      - clue: "Monto reclamado en carta excede monto reconocido por el ajustador sin justificación"
        why: "Sugiere intento de sobre reclamación"
      - clue: "Emisor de la carta ajeno al contrato"
        why: "Compromete legitimación del reclamo"
    medium:
      - clue: "Brecha temporal >15 días sin sustento"
        why: "Infringe condiciones de aviso oportuno"
      - clue: "Bienes descritos no corresponden a la pérdida denunciada"
        why: "Indicia posible reclamación de daños no ocurridos"

response_template:
  output_format:
    documento_analizado: "carta_de_reclamacion_formal_a_la_aseguradora"
    analisis_completo: |
      Se cuenta con carta reclamación emitida por el asegurado {emisor_carta}, con fecha {fecha_carta}, dirigida a la compañía de seguros, donde refieren los hechos ocurridos el pasado {fecha_ocurrencia}, del cual se presentó un robo de mercancía cuando se encontraba la unidad que transportaba la mercancía circulando sobre {ubicacion_siniestro}; se especifica una reclamación por la cantidad de {monto_reclamado}. Se indicó como mercancía afectada consistente en {bien_afectado}.
      Incluir la validación de póliza, siniestro, legitimación del emisor, consistencia de bienes y monto reclamado versus reportes del ajustador, destacando cualquier hallazgo relevante o confirmando correspondencias.
    risk_level: "bajo|medio|alto|critico"
    fraud_score: 0.0
    confidence: 0.0
    indicators: []
    recommendations: []

    verificaciones:
      fecha_reclamacion_posterior:
        resultado: "desconocido"
        diferencia_dias: 0
        detalle: ""
      numero_poliza_consistente:
        resultado: "desconocido"
        referencia_poliza: ""
        detalle: ""
      numero_siniestro_consistente:
        resultado: "desconocido"
        referencia_ajustador: ""
        detalle: ""
      emisor_legitimado:
        resultado: "desconocido"
        fundamento: ""
        detalle: ""
      bienes_consistentes:
        resultado: "desconocido"
        referencias: []
        detalle: ""
      monto_vs_ajustador:
        resultado: "desconocido"
        monto_carta: ""
        monto_ajustador: ""
        diferencia: ""
        detalle: ""

    validacion_cruzada:
      poliza:
        asegurado_principal: ""
        asegurados_adicionales: []
        observaciones: ""
      denuncia:
        bienes_reportados: []
        coincidencia_con_carta: "pendiente"
        observaciones: ""
      ajustador:
        monto_reclamado_reportado: ""
        fuente: ""
        observaciones: ""

    validation_tasks:
      - tarea: "Confirmar en sistemas la pertenencia del emisor de la carta al listado de asegurados adicionales"
        fuente: "Póliza y endosos vigentes"
        prioridad: "alta"
        estado: "pendiente"
      - tarea: "Reconciliar monto reclamado con reportes inicial y final del ajustador"
        fuente: "Informes del ajustador"
        prioridad: "alta"
        estado: "pendiente"
      - tarea: "Verificar consistencia de bienes reclamados contra denuncia y carpeta"
        fuente: "Denuncia / carpeta de investigación"
        prioridad: "media"
        estado: "pendiente"
