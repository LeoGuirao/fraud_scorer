metadata:
  type: carta_aclatoria_comprobantes_peaje
  version: "2.0"
  author: "Equipo Fraude HDI"
  last_updated: "2025-03-12"
  description: "Guía renovada para validar cartas aclaratorias de comprobantes de peaje correlacionando ruta, horarios y narrativa con el monitoreo GPS del caso"

definition:
  nature: "Carta emitida por el asegurado o su representante para aclarar la ausencia o extravío de tickets de caseta asociados a un traslado específico"
  legal_importance: "Media: sirve como declaración formal para justificar gastos de peaje dentro del expediente del siniestro y sustenta la trazabilidad del traslado"
  critical_elements:
    - fecha_carta
    - emisor_carta
    - firmante_nombre
    - firmante_cargo
    - destinatario_nombre
    - destinatario_cargo
    - asunto_principal
    - descripcion_evento
    - consecuencia_evento
    - casetas_involucradas
    - horarios_reportados
    - evidencia_respaldo
    - proposito_notificacion
    - firmas

methodology:
  analysis_approach: |
    1. Confirmar integridad documental: fecha, destinatario, firmas y anexos que respalden la aclaración.
    2. Identificar el asunto principal y la narrativa del evento (robo, extravío, falta de tickets) con sus consecuencias.
    3. Normalizar casetas y horarios declarados para compararlos contra el monitoreo GPS del caso (tolerancia de distancia ≤150 m; tolerancia de tiempo ≤20 minutos).
    4. Confirmar que la ruta declarada sea consistente con la Carta Porte, la denuncia y otros documentos de logística.
    5. Documentar hallazgos sólo cuando existan discrepancias en las verificaciones; las recomendaciones deben centrarse en faltantes documentales o datos no corroborados.

  fraud_indicators:
    high_risk:
      - pattern: casetas_no_coinciden
        detection: "Las casetas declaradas no se localizan en los registros del monitoreo GPS dentro del umbral permitido"
        severity: "alto"
        evidence_hint: "Comparar cada caseta, hora y coordenada con el dataset GPS"
        follow_up: "Solicitar evidencia adicional (bitácora, tickets, reportes de autopista) y entrevista con el operador"
      - pattern: ruta_inconsistente_gps
        detection: "La ruta descrita en la carta es incompatible con la secuencia de posiciones GPS (desviaciones no justificadas)"
        severity: "alto"
        evidence_hint: "Contrastar segmentos de ruta/casetas con tramos GPS visibles"
        follow_up: "Escalar revisión y solicitar reconstrucción detallada del trayecto"
    medium_risk:
      - pattern: horarios_sin_soporte
        detection: "Los horarios declarados difieren significativamente de los registros GPS o no se pueden comparar"
        severity: "medio"
        evidence_hint: "Resaltar diferencias >20 minutos o ausencia de horas"
        follow_up: "Requerir bitácora de operador o registros adicionales"
      - pattern: evidencia_peaje_incompleta
        detection: "Se mencionan tickets o facturas de peaje pero no se anexan copias ni comprobantes"
        severity: "medio"
        evidence_hint: "Listar documentos citados vs. presentes"
        follow_up: "Solicitar documentación digitalizada o confirmación con la concesionaria"
    low_risk:
      - pattern: narrativa_generica
        detection: "La carta describe el evento de manera general sin contradicciones evidentes pero con poco detalle operativo"
        severity: "bajo"
        evidence_hint: "Señalar elementos narrativos que podrían ampliarse"
        follow_up: "Recomendar ampliar contexto para futuras validaciones"

  validation_rules:
    fecha_carta:
      type: pattern
      pattern: '^(19|20)\d{2}-\d{2}-\d{2}$'
    casetas_involucradas:
      type: list
      values: []

  cross_reference_documents:
    - reporte_monitoreo_gps
    - cfdi_carta_porte
    - carta_de_reclamacion_formal_a_la_aseguradora
    - carta_de_reclamacion_formal_al_transportista
    - denuncia_de_los_hechos

  evidence_expectations:
    - "Listado de casetas, horarios aproximados y unidades involucradas"
    - "Narrativa que explique el extravío o ausencia de tickets de peaje"
    - "Referencia a medios de respaldo (bitácoras, reportes internos, folios de autopista)"
    - "Conexión explícita con la ruta asignada en Carta Porte y monitoreo GPS"

  red_flags:
    critical:
      - clue: "Casetas declaradas no aparecen en GPS ni en la ruta logística"
        why: "Sugiere alteración de la ruta o intento de justificar gastos inexistentes"
      - clue: "Explicación del robo/extravío sin soporte documental ni registro adicional"
        why: "Debilita la legitimidad de la reclamación por peajes"
    medium:
      - clue: "Horarios declarados incompatibles con los tiempos de tránsito"
        why: "Indica posible manipulación del relato o desconocimiento del trayecto real"
      - clue: "Ausencia de evidencia alternativa cuando no existen tickets"
        why: "Reduce capacidad de verificación y puede encubrir sobrecostos"

response_template:
  output_format:
    documento_analizado: "carta_aclatoria_comprobantes_peaje"
    analisis_completo: |
      Se presentó una carta de {descripcion_paginas} de {nombre_emisor}, firmada por {nombre_firmante} ({cargo_firmante}). La carta está dirigida a {nombre_destinatario} ({cargo_destinatario}).
      El asunto principal de la carta es {asunto_principal}. En ella, se informa sobre {descripcion_resumen}. Como resultado de este hecho, {impacto_resumen}.
      La carta detalla: {detalle_notificacion}.
      La empresa enfatiza que el propósito de esta notificación es: {proposito_notificacion}.
    risk_level: "bajo|medio|alto|critico"
    fraud_score: 0.0
    confidence: 0.0
    indicators: []
    recommendations: []

    aclaracion:
      fecha_carta: ""
      nombre_emisor: ""
      firmante_nombre: ""
      firmante_cargo: ""
      destinatario_nombre: ""
      destinatario_cargo: ""
      asunto_principal: ""
      descripcion_evento: ""
      consecuencia_evento: ""
      detalle_carta: ""
      proposito_notificacion: ""
      casetas_involucradas: []
      horarios_reportados: []
      evidencia_respaldo: []

    verificaciones:
      ruta_vs_gps:
        resultado: "desconocido"
        casetas_validadas: []
        casetas_pendientes: []
        tolerancia_metros: 150
        detalle: ""
      horarios_vs_gps:
        resultado: "desconocido"
        diferencia_max_minutos: null
        tolerancia_minutos: 20
        detalle: ""

    validacion_cruzada:
      monitoreo_gps:
        documentos_consultados: []
        casetas_validadas: []
        observaciones: ""

    validation_tasks:
      - tarea: "Cruzar cada caseta y horario declarado contra el monitoreo GPS del caso"
        fuente: "Datasets GPS indexados"
        prioridad: "alta"
        estado: "pendiente"
      - tarea: "Solicitar evidencia complementaria cuando el GPS no respalde casetas u horarios"
        fuente: "Bitácoras de operación / concesionarias"
        prioridad: "media"
        estado: "pendiente"
      - tarea: "Confirmar que la ruta declarada coincide con Carta Porte y documentación logística"
        fuente: "CFDI Carta Porte / protocolo de acción"
        prioridad: "media"
        estado: "pendiente"
