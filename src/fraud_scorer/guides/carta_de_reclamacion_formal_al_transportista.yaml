metadata:
  type: carta_de_reclamacion_formal_al_transportista
  version: "2.0"
  author: "Equipo Fraude HDI"
  last_updated: "2025-03-11"
  description: "Guía renovada para validar reclamaciones dirigidas al transportista, con verificaciones cruzadas de mercancía, montos y documentación soporte"

definition:
  nature: "Comunicado formal donde el asegurado reclama al transportista por la pérdida o robo de mercancía trasladada"
  legal_importance: "Alta: habilita la subrogación contra el transportista y documenta el monto reclamado"
  critical_elements:
    - fecha_carta
    - nombre_asegurado
    - nombre_transportista
    - documento_ampara_tipo
    - documento_ampara_numero
    - descripcion_mercancia
    - cantidades_mercancia
    - pesos_mercancia
    - monto_reclamado
    - moneda_monto
    - tipo_cambio_referencia
    - contacto_transportista
    - firma_representante
    - documentos_soporte

methodology:
  analysis_approach: |
    1. Confirmar fecha, destinatario y firma de la carta; registrar documentos soporte citados (pedimento, facturas, contratos).
    2. Validar que el nombre del transportista coincida con la Carta Porte, contrato de prestación de servicios o el protocolo de acción y reacción (en ese orden).
    3. Verificar la existencia del documento que ampara la mercancía (pedimento, factura) y que el número citado coincida con el expediente digital.
    4. Comparar la mercancía descrita (tipo, cantidades, peso) con la denuncia de los hechos y la carta de reclamación a la aseguradora.
    5. Contrastar el monto reclamado con la carta de reclamación a la aseguradora; si hay monedas distintas, convertir aplicando el tipo de cambio del pedimento/factura y tolerancia ±5 %.
    6. Corroborar que las cantidades reclamadas no excedan lo facturado; permitir reclamaciones parciales pero no superiores.
    7. Registrar indicadores sólo cuando existan discrepancias u omisiones en estas verificaciones y limitar recomendaciones a faltantes documentales.

  fraud_indicators:
    high_risk:
      - pattern: transportista_no_verificado
        detection: "El nombre del transportista en la carta no coincide con Carta Porte, contrato o protocolo"
        severity: "alto"
        evidence_hint: "Comparar razón social declarada vs. documentos logísticos"
        follow_up: "Solicitar aclaración documental o contrato vigente que respalde la relación"
      - pattern: documento_ampara_inexistente
        detection: "No se localiza el documento que ampara la mercancía o el número citado es distinto"
        severity: "alto"
        evidence_hint: "Indicar número citado en carta vs. pedimento/factura en expediente"
        follow_up: "Requerir copia certificada del documento soporte"
      - pattern: mercancia_no_facturada
        detection: "La mercancía reclamada no aparece en las facturas de adquisición"
        severity: "alto"
        evidence_hint: "Listar mercancía reclamada y facturas consultadas"
        follow_up: "Solicitar facturas completas o evidencia contable adicional"
      - pattern: cantidad_excedente_factura
        detection: "Las cantidades reclamadas superan lo adquirido según factura"
        severity: "alto"
        evidence_hint: "Comparar Q_reclamada vs. Q_factura por producto"
        follow_up: "Escalar a revisión manual y requerir aclaración formal"
      - pattern: monto_inconsistente_carta_aseguradora
        detection: "Monto reclamado al transportista difiere >5% del monto reclamado a la aseguradora (tras ajuste cambiario)"
        severity: "alto"
        evidence_hint: "Citar ambos montos, moneda y diferencia porcentual"
        follow_up: "Solicitar conciliación de montos y soportes contables"
    medium_risk:
      - pattern: documento_ampara_incompleto
        detection: "Se cita documento soporte pero falta la copia o anexos en expediente"
        severity: "medio"
        evidence_hint: "Señalar documento faltante"
        follow_up: "Solicitar digitalización completa del soporte"
      - pattern: mercancia_no_coincide_denuncia
        detection: "Descripción de mercancía no coincide con denuncia o carta a la aseguradora"
        severity: "medio"
        evidence_hint: "Comparar narrativa entre documentos"
        follow_up: "Requerir aclaración y evidencias adicionales"
      - pattern: tipo_cambio_no_definido
        detection: "No se localiza tipo de cambio para convertir montos en distintas monedas"
        severity: "medio"
        evidence_hint: "Citar montos y monedas involucradas"
        follow_up: "Solicitar pedimento o factura con tipo de cambio aplicable"
    low_risk:
      - pattern: coincidencia_parcial_factura
        detection: "Las cantidades reclamadas son menores a lo facturado; corresponde a reclamación parcial"
        severity: "bajo"
        evidence_hint: "Registrar cantidades reclamadas vs. adquiridas"
        follow_up: "Documentar alcance de la reclamación y confirmar cierre"
      - pattern: datos_contacto_incompletos
        detection: "La carta omite datos de contacto del transportista (correo, teléfono)"
        severity: "bajo"
        evidence_hint: "Enumerar campos faltantes"
        follow_up: "Sugerir completar información para futuras notificaciones"

  validation_rules:
    fecha_carta:
      type: pattern
      pattern: '^(19|20)\d{2}-\d{2}-\d{2}$'
    documento_ampara_numero:
      type: pattern
      pattern: '^[0-9A-Z-]{6,}$'
    monto_reclamado:
      type: pattern
      pattern: '^\\$?\\s?[0-9]{1,3}(?:[,\\s]?[0-9]{3})*(?:\\.[0-9]{2})?\\s?(?:USD|MXN|M\\.N\\.|MN)?$'
    nombre_transportista:
      type: pattern
      pattern: "^.{3,}$"

  cross_reference_documents:
    - cfdi_carta_porte
    - contrato_prestacion_servicio_transportista
    - protocolo_de_accion_y_reaccion
    - pedimento_importacion
    - carta_de_reclamacion_formal_a_la_aseguradora
    - facturas_comerciales_internacionales
    - denuncia_de_los_hechos

  evidence_expectations:
    - "Carta Porte con razón social del transportista coincidente"
    - "Pedimento o factura con número citado en la carta"
    - "Carta de reclamación a la aseguradora con monto equivalente"
    - "Facturas que respalden cantidades y mercancía reclamadas"

  red_flags:
    critical:
      - clue: "Transportista distinto al citado en la logística"
        why: "Impide ejercer subrogación y genera duda sobre legitimidad del reclamo"
      - clue: "Documento ampara mercancía inexistente o faltante"
        why: "Sugiere intento de cobrar mercancía sin soporte"
    medium:
      - clue: "Monto sin conciliación con la reclamación principal"
        why: "Podría derivar en doble reclamación o sobrecobro"
      - clue: "Mercancía descrita de forma genérica u omisa"
        why: "Dificulta validar la pérdida y su cuantificación"

response_template:
  output_format:
    documento_analizado: "carta_de_reclamacion_formal_al_transportista"
    analisis_completo: |
      Se cuenta con carta de reclamación emitida por el asegurado {asegurado_emisor} al transportista en fecha de {fecha_carta}, dirigida para la empresa transportista {nombre_transportista}; se menciona mercancía amparada por {documento_ampara_resumen}. Se específica el contenido de mercancía que consta en {detalle_mercancia_resumido}.
    risk_level: "bajo|medio|alto|critico"
    fraud_score: 0.0
    confidence: 0.0
    indicators: []
    recommendations: []

    verificaciones:
      transportista_identificado:
        resultado: "desconocido"
        documento_soporte: ""
        detalle: ""
      documento_ampara_consistente:
        resultado: "desconocido"
        documento: ""
        detalle: ""
      mercancia_vs_denuncia:
        resultado: "desconocido"
        referencias: []
        detalle: ""
      monto_vs_carta_aseguradora:
        resultado: "desconocido"
        monto_transportista: ""
        monto_aseguradora: ""
        diferencia: ""
        detalle: ""
      cantidades_vs_facturas:
        resultado: "desconocido"
        resumen: ""
        detalle: ""

    validacion_cruzada:
      carta_porte:
        transportista: ""
        coincidencia: "pendiente"
        observaciones: ""
      contrato_transportista:
        transportista: ""
        coincidencia: "pendiente"
        observaciones: ""
      carta_aseguradora:
        monto: ""
        moneda: ""
        observaciones: ""
      facturas:
        documentos: []
        observaciones: ""

    validation_tasks:
      - tarea: "Obtener documento soporte que ampare la mercancía si no se encuentra en expediente"
        fuente: "Pedimento / factura citada en la carta"
        prioridad: "alta"
        estado: "pendiente"
      - tarea: "Conciliar montos reclamados entre carta al transportista y carta a la aseguradora"
        fuente: "Cartas de reclamación y soportes contables"
        prioridad: "alta"
        estado: "pendiente"
      - tarea: "Cruzar cantidades reclamadas contra facturas de adquisición"
        fuente: "Facturas comerciales"
        prioridad: "media"
        estado: "pendiente"
