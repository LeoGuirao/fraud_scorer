metadata:
  type: conocimiento_de_embarque
  version: "2.0"
  author: "Equipo Fraude HDI"
  last_updated: "2025-03-15"
  description: "Guía actualizada para auditar conocimientos de embarque integrando verificaciones cruzadas obligatorias y narrativa estandarizada"

definition:
  nature: "Documento portuario que avala la entrega de mercancía al transportista, indicando origen, destino y condiciones de embarque"
  legal_importance: "Alta — sustenta la entrega y responsabilidad del transporte en operaciones marítimas y sirve como soporte de subrogación"
  critical_elements:
    - numero_conocimiento
    - fecha_salida
    - hora_salida
    - puerto_origen
    - puerto_destino
    - nombre_transportista
    - nombre_operador
    - identificacion_unidad
    - placas_unidad
    - descripcion_mercancia
    - peso
    - valor_carga
    - numero_pedimento
    - documentos_anexos

methodology:
  analysis_approach: |
    1. Confirmar integridad documental: membrete, folio/número, datos del emisor y fecha de expedición.
    2. Cruzar fecha y hora de salida con otros conocimientos de embarque del expediente (si existen) y reportar discrepancias.
    3. Validar el número de pedimento citado: indicar si coincide totalmente o parcialmente (dígitos consecutivos) con pedimentos de importación en el caso.
    4. Corroborar transportista, operadores y unidades (placas y semirremolques) con la carpeta de investigación y denuncias.
    5. Verificar que la mercancía, cantidades y pesos coincidan con Carta Porte, denuncia de los hechos y carpeta de investigación.
    6. Sólo reportar indicadores de riesgo cuando las verificaciones anteriores arrojen inconsistencias o datos faltantes; omitir evidencia textual.
    7. Registrar recomendaciones únicamente cuando falten documentos o datos en otros soportes (pedimento, carta al transportista, denuncias).

  fraud_indicators:
    high_risk:
      - pattern: pedimento_no_coincide
        detection: "El número de pedimento citado no coincide (ni parcialmente) con los pedimentos del expediente"
        severity: "alto"
        evidence_hint: "Comparar dígitos reportados vs. pedimento importación"
        follow_up: "Solicitar pedimento correcto o documentación que justifique la discrepancia"
      - pattern: operador_placas_inconsistentes
        detection: "Operador o placas asignadas difieren respecto a denuncia/carpeta"
        severity: "alto"
        evidence_hint: "Listar operador/placas en conocimiento vs. carpeta"
        follow_up: "Solicitar aclaración y soportes actualizados"
      - pattern: mercancia_no_coincide
        detection: "Descripción, cantidad o peso no coinciden con Carta Porte o denuncia"
        severity: "alto"
        evidence_hint: "Detallar diferencias por documento"
        follow_up: "Requerir conciliación de inventarios y soportes"
    medium_risk:
      - pattern: fechas_conocimientos_divergen
        detection: "Las fechas entre conocimientos de embarque del mismo caso difieren sin justificación"
        severity: "medio"
        evidence_hint: "Citar fechas detectadas por documento"
        follow_up: "Solicitar cronograma validado del embarque"
      - pattern: pedimento_coincide_parcial
        detection: "Sólo coinciden parcialmente los dígitos del pedimento"
        severity: "medio"
        evidence_hint: "Indicar número de dígitos coincidentes"
        follow_up: "Requerir copia íntegra del pedimento y confirmación del agente aduanal"
      - pattern: datos_unidad_incompletos
        detection: "Faltan placas o identificadores de unidades o remolques"
        severity: "medio"
        evidence_hint: "Enumerar campos faltantes"
        follow_up: "Solicitar información complementaria"
    low_risk:
      - pattern: narrativa_general
        detection: "La narrativa es general pero coherente, sin afectar verificaciones principales"
        severity: "bajo"
        evidence_hint: "Precisar elementos que podrían detallarse"
        follow_up: "Recomendar completar información para expediente"

  validation_rules:
    numero_conocimiento:
      type: pattern
      pattern: "^[A-Z0-9-]{5,20}$"
    fecha_salida:
      type: pattern
      pattern: '^(19|20)\d{2}-\d{2}-\d{2}$'
    hora_salida:
      type: pattern
      pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
    peso:
      type: pattern
      pattern: '^[0-9]+(\.[0-9]{2})?$'
    valor_carga:
      type: pattern
      pattern: '^[0-9]+(\.[0-9]{2})?$'

  cross_reference_documents:
    - carta_porte_simple
    - cfdi_carta_porte
    - pedimento_importacion
    - carta_de_reclamacion_formal_al_transportista
    - carta_de_reclamacion_formal_a_la_aseguradora
    - denuncia_de_los_hechos
    - carpeta_de_investigacion
    - facturas_comerciales_internacionales

  evidence_expectations:
    - "Fecha de salida y horario consistentes entre conocimientos de embarque del caso"
    - "Número de pedimento validado con pedimento de importación"
    - "Operador y placas coincidentes con denuncia/carpeta"
    - "Mercancía (descripción, peso, cantidad) alineada con Carta Porte y denuncia"
    - "Documentos soporte disponibles (pedimento, carta al transportista, facturas)"

  red_flags:
    critical:
      - clue: "Operador o unidad distinta"
        why: "Dificulta trazabilidad"
      - clue: "Origen/destino divergente"
        why: "Sugiere inconsistencias logísticas"
    medium:
      - clue: "Hora de salida incompatible"
        why: "Crea duda sobre cronología"
      - clue: "Documento informal sin respaldo"
        why: "Riesgo de soporte insuficiente"

response_template:
  output_format:
    documento_analizado: "conocimiento_de_embarque"
    analisis_completo: |
      Se cuenta con comprobante emitido por {emisor_documento}, fechado el {fecha_documento}. El documento detalla la información del transportista, los datos de las unidades que trasladaban la mercancía, los operadores asignados a cada una, y el contenido y peso de cada cargamento.
    risk_level: "bajo|medio|alto|critico"
    fraud_score: 0.0
    confidence: 0.0
    indicators: []
    recommendations: []

    verificaciones:
      fechas_entre_conocimientos:
        resultado: "desconocido"
        fecha_documento: ""
        fechas_detectadas: []
        detalle: ""
      pedimento_vs_pedimento:
        resultado: "desconocido"
        pedimento_conocimiento: ""
        pedimento_referencia: ""
        coincidencia_digitos: ""
        detalle: ""
      operador_vs_denuncia:
        resultado: "desconocido"
        operador_conocimiento: ""
        operador_denuncia: ""
        detalle: ""
      placas_vs_carpeta:
        resultado: "desconocido"
        placas_conocimiento: []
        placas_carpeta: []
        coincidencias: []
        detalle: ""
      cantidades_vs_documentos:
        resultado: "desconocido"
        resumen_conocimiento: ""
        referencias: []
        detalle: ""

    validacion_cruzada:
      pedimento:
        numero_en_pedimento: ""
        coincidencia: "pendiente"
        observaciones: ""
      denuncia:
        operadores: []
        coincidencia_operador: "pendiente"
        observaciones: ""
      carpeta_investigacion:
        placas_registradas: []
        coincidencia_placas: "pendiente"
        observaciones: ""
      carta_porte:
        mercancia_declarada: ""
        coincidencia: "pendiente"
        observaciones: ""

    validation_tasks:
      - tarea: "Conciliar número de pedimento contra el documento de pedimento de importación"
        fuente: "Pedimento de importación"
        prioridad: "alta"
        estado: "pendiente"
      - tarea: "Corroborar operadores y placas con denuncia y carpeta de investigación"
        fuente: "Denuncia / carpeta de investigación"
        prioridad: "alta"
        estado: "pendiente"
      - tarea: "Verificar cantidades y pesos contra Carta Porte y mercancía declarada"
        fuente: "Carta Porte / denuncias"
        prioridad: "media"
        estado: "pendiente"
