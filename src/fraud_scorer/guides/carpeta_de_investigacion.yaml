metadata:
  type: carpeta_de_investigacion
  version: "2.0"
  author: "Equipo Fraude HDI"
  last_updated: "2025-03-12"
  description: "Guía reforzada para auditar carpetas de investigación con narrativas múltiples y acreditaciones de propiedad"

definition:
  nature: "Expediente del Ministerio Público que concentra denuncias, actuaciones y acreditaciones relacionadas con el siniestro"
  legal_importance: "Alta: acredita conocimiento de la autoridad, sustenta la narrativa del siniestro y documenta la legitimación del asegurado"
  critical_elements:
    - numero_carpeta
    - fiscalia
    - agente_ministerio_publico
    - fecha_apertura
    - denuncias
    - declarantes
    - fecha_siniestro
    - narrativa_hechos
    - vehiculos_implicados
    - bienes_afectados
    - acreditaciones_propiedad
    - documentos_soporte
    - sellos_firmas

methodology:
  analysis_approach: |
    1. Confirmar integridad del expediente: número de carpeta, fiscalía competente, agente ministerial, fechas y sellos/firmas originales.
    2. Identificar cuántas denuncias contiene el expediente y perfilar a cada declarante (rol, título, autoridad que recibe la denuncia).
    3. Reconstruir la narrativa de cada denuncia (fecha de ocurrencia, descripción detallada de los hechos, ruta, placas y mercancía).
    4. Comparar las denuncias entre sí para detectar contradicciones sustanciales en fechas, lugares, participantes, placas o montos.
    5. Revisar las acreditaciones de propiedad y cotejarlas contra lo declarado (mercancías, montos, placas, documentos soporte).
    6. Registrar hallazgos únicamente cuando las verificaciones arrojen discrepancias o falta de documentación.
    7. Documentar recomendaciones cuando falte información para concluir verificaciones o se requiera soporte adicional de la autoridad.

  fraud_indicators:
    high_risk:
      - pattern: fiscalia_fuera_jurisdiccion
        detection: "La fiscalía o agencia que conoció del hecho se encuentra fuera de la jurisdicción donde ocurrió el siniestro"
        severity: "alto"
        follow_up: "Solicitar aclaración documental sobre competencia territorial o traslado de carpeta"
      - pattern: denuncias_inconsistentes
        detection: "Las denuncias dentro de la carpeta se contradicen respecto a fecha, lugar, ruta, placas o modo de ocurrencia"
        severity: "critico"
        follow_up: "Escalar a unidad antifraude y requerir aclaraciones formales a los declarantes"
      - pattern: acreditacion_no_corrobora
        detection: "Las acreditaciones de propiedad no sustentan las placas, mercancías o montos que se declararon en la carpeta"
        severity: "alto"
        follow_up: "Solicitar documentación complementaria de propiedad y confirmar con el asegurado"
    medium_risk:
      - pattern: anexos_incompletos
        detection: "Se citan anexos o constancias que no se localizan dentro del expediente digital"
        severity: "medio"
        follow_up: "Requerir digitalización completa de anexos mencionados"
      - pattern: autoridad_no_identificada
        detection: "No se identifica con precisión la autoridad o agente ministerial que tomó la declaración"
        severity: "medio"
        follow_up: "Confirmar con la fiscalía quién tomó conocimiento y solicitar constancia"
    low_risk:
      - pattern: narrativa_general
        detection: "La narrativa describe los hechos de manera genérica pero sin contradicciones relevantes"
        severity: "bajo"
        follow_up: "Recomendar ampliar narrativa para expediente interno"

  validation_rules:
    numero_carpeta:
      type: pattern
      pattern: "^[A-Z0-9/_-]{6,30}$"
    fecha_apertura:
      type: pattern
      pattern: '^(19|20)\d{2}-\d{2}-\d{2}$'
    fecha_siniestro:
      type: pattern
      pattern: '^(19|20)\d{2}-\d{2}-\d{2}$'
    agente_ministerio_publico:
      type: pattern
      pattern: "^.{3,}$"

  cross_reference_documents:
    - denuncia_de_los_hechos
    - carta_de_reclamacion_formal_a_la_aseguradora
    - carta_de_reclamacion_formal_al_transportista
    - cfdi_carta_porte
    - carta_porte_simple
    - pedimento_importacion
    - facturas_comerciales_internacionales
    - informe_final_del_ajustador
    - acreditacion_de_propiedad_y_representacion

  evidence_expectations:
    - "Denuncias fechadas y firmadas por autoridad competente"
    - "Narrativas consistentes con ruta, placas y mercancía reportada en el siniestro"
    - "Acreditaciones de propiedad que documenten mercancías y unidades involucradas"
    - "Documentación soporte citada en la carpeta (pedimentos, facturas, cartas porte)"

  red_flags:
    critical:
      - clue: "Denuncias contradictorias respecto a la cronología o los participantes"
        why: "Sugiere intento de manipular la narrativa del siniestro"
      - clue: "Acreditaciones que no sustentan la mercancía o vehículos declarados"
        why: "Compromete la legitimación de la reclamación"
    medium:
      - clue: "Fiscalía distinta sin justificación documental"
        why: "Podría indicar carpeta simulada o radicada fuera de jurisdicción"
      - clue: "Constancias o anexos ausentes"
        why: "Impide corroborar la veracidad de la documentación"

response_template:
  output_format:
    documento_analizado: "carpeta_de_investigacion"
    analisis_completo: |
      Describir la narrativa consolidada siguiendo la estructura solicitada para las denuncias y acreditaciones.
    risk_level: "bajo|medio|alto|critico"
    fraud_score: 0.0
    confidence: 0.0
    indicators: []
    recommendations: []

    denuncias:
      - orden: 1
        declarante_titulo: ""
        declarante_nombre: ""
        declarante_rol: ""
        fiscalia: ""
        numero_carpeta: ""
        fecha_inicio: ""
        fecha_siniestro: ""
        autoridad: ""
        descripcion_evento: ""
        narrativa_detallada: ""
        ruta: ""
        vehiculos: []
        mercancias: []
        conclusion: ""

    acreditaciones:
      - tipo_bien: ""
        presentante_titulo: ""
        presentante_nombre: ""
        presentante_rol: ""
        documentos: []
        observaciones: ""

    verificaciones:
      coherencia_denuncias:
        resultado: "desconocido"
        diferencias: []
        detalle: ""
      competencia_jurisdiccion:
        resultado: "desconocido"
        fiscalia_estado: []
        ubicaciones_detectadas: []
        detalle: ""
      narrativa_vs_acreditacion:
        resultado: "desconocido"
        mercancias_coincidentes: []
        mercancias_pendientes: []
        mercancias_extras: []
        documentos_validados: []
        documentos_pendientes: []
        documentos_sin_fuente: []
        documentos_soporte: []
        detalle: ""

    validacion_cruzada:
      denuncias:
        total_declarantes: 0
        coincidencias_clave: []
        resumen: ""
      acreditaciones:
        documentos_soporte: []
        observaciones: ""
      jurisdiccion:
        fiscalia: ""
        estados_detectados: []
        observaciones: ""

    validation_tasks:
      - tarea: "Confirmar competencia territorial y autoridad que recibió la denuncia"
        fuente: "Fiscalía y constancias oficiales"
        prioridad: "alta"
        estado: "pendiente"
      - tarea: "Corroborar narrativa del siniestro con cartas, Carta Porte y reportes GPS"
        fuente: "Documentación logística del caso"
        prioridad: "alta"
        estado: "pendiente"
      - tarea: "Verificar acreditaciones de propiedad versus mercancía y unidades declaradas"
        fuente: "Pedimentos, facturas y cartas porte"
        prioridad: "media"
        estado: "pendiente"
