metadata:
  type: carta_porte_simple
  version: "2.0"
  author: "Equipo Fraude HDI"
  last_updated: "2025-03-18"
  description: "Guía reforzada para auditar cartas porte simples, alineada con validaciones cruzadas contra póliza, denuncias y operadores declarados, detectando riesgos operativos y de legitimación"

definition:
  nature: "Formato interno/administrativo emitido por transportistas para amparar un traslado sin timbrado fiscal"
  legal_importance: "Media - Documento operativo sin validez fiscal, sirve como evidencia logística complementaria"
  critical_elements:
    - remitente
    - destinatario
    - descripcion_mercancia
    - cantidad
    - peso
    - volumen
    - placas_vehiculo
    - caracteristicas_unidad
    - nombre_operador
    - permisos_sct
    - ruta_origen
    - ruta_destino
    - fecha_emision
    - hora_salida
    - numero_interno_documento

methodology:
  analysis_approach: |
    1. Validar integridad documental: folio interno, fecha de emisión, remitente, destinatario, firmas y diferencia frente al CFDI Carta Porte.
    2. Reconciliar destinatario/cliente con el asegurado principal o asegurados adicionales vigentes en la póliza y cartas de reclamación.
    3. Confirmar mercancía/vehículos declarados, cantidades y peso con carta a la aseguradora, denuncias y acreditaciones logísticas.
    4. Verificar operador (nombre, firma, permisos) y unidad (placas, configuración) contra denuncias, carpeta de investigación y bitácoras operativas.
    5. Contrastar fecha y hora de emisión con el inicio del recorrido reportado en denuncias, GPS o protocolos de acción.
    6. Detectar inconsistencias relevantes (datos faltantes, rutas divergentes, firmas inexistentes) y clasificar indicadores según severidad.
    7. Limitar recomendaciones a faltantes documentales que impidan concluir verificaciones (póliza, denuncia, soportes logísticos).

  fraud_indicators:
    high_risk:
      - pattern: cliente_no_autorizado
        detection: "Destinatario o cliente citado no coincide con el asegurado ni con asegurados adicionales vigentes en la póliza"
        severity: "alto"
        evidence_hint: "Comparar destinatario con póliza, endosos y carta de reclamación"
        follow_up: "Solicitar documentación que legitime al destinatario como asegurado adicional o cesionario"
      - pattern: operador_no_coincide_denuncia
        detection: "Operador o chofer declarado no coincide con los declarantes en la denuncia o maneja placas distintas a las reconocidas"
        severity: "alto"
        evidence_hint: "Cotejar nombres y placas con denuncias/carpeta de investigación"
        follow_up: "Escalar a investigación y solicitar entrevistas adicionales"
      - pattern: ruta_invalida
        detection: "Fecha u hora de emisión no concuerdan con el inicio de recorrido declarado en denuncias o GPS"
        severity: "alto"
        evidence_hint: "Comparar sellos de fecha con narrativa de salida en denuncias"
        follow_up: "Solicitar aclaración formal del transportista y evidencia de ruta"
    medium_risk:
      - pattern: datos_transporte_incompletos
        detection: "Placas, tipo de unidad o permisos SCT incompletos o ilegibles"
        severity: "medio"
        evidence_hint: "Identificar campos omitidos y comparar con tarjeta de circulación"
        follow_up: "Solicitar soporte actualizado de unidad y permisos SCT"
      - pattern: mercancia_no_coincide_denuncia
        detection: "Categoría de mercancía o unidad declarada no se identifica en denuncias o carta a la aseguradora"
        severity: "medio"
        evidence_hint: "Contrastar narrativa de mercancía con denuncia y carta de reclamación"
        follow_up: "Solicitar aclaración y evidencia logística complementaria"
      - pattern: firmas_incompletas
        detection: "Faltan firmas de operador o remitente en la carta porte simple"
        severity: "medio"
        evidence_hint: "Listar espacios en blanco o firmas digitalizadas sin respaldo"
        follow_up: "Solicitar ratificación de firmas o acta circunstanciada"
    low_risk:
      - pattern: campos_administrativos_incompletos
        detection: "Campos secundarios (p.ej., hora estimada) faltantes sin afectar verificaciones principales"
        severity: "bajo"
        evidence_hint: "Listar campos omitidos"
        follow_up: "Recomendar completar expedientes internos"

  validation_rules:
    fecha_emision:
      type: pattern
      pattern: '^(19|20)\d{2}-\d{2}-\d{2}$'
    hora_salida:
      type: pattern
      pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
    placas_vehiculo:
      type: pattern
      pattern: "^[A-Z0-9-]{5,10}$"
    nombre_operador:
      type: pattern
      pattern: "^.{3,}$"
    permisos_sct:
      type: pattern
      pattern: "^[A-Z0-9-]{5,}$"
    ruta_origen:
      type: pattern
      pattern: "^.{3,}$"
    ruta_destino:
      type: pattern
      pattern: "^.{3,}$"

  cross_reference_documents:
    - carta_de_reclamacion_formal_a_la_aseguradora
    - cfdi_carta_porte
    - denuncia_de_los_hechos
    - carpeta_de_investigacion
    - tarjeta_de_circulacion
    - facturas_comerciales_internacionales
    - pedimento_importacion
    - reporte_monitoreo_gps
    - carta_aclatoria_comprobantes_peaje

  evidence_expectations:
    - "Destinatario/cliente legitimado en póliza o endosos"
    - "Operador y placas coincidentes con denuncias o carpeta de investigación"
    - "Fecha/hora de emisión alineada al inicio de recorrido reportado"
    - "Descripción general de mercancía o vehículos coherente con carta a la aseguradora y acreditaciones"
    - "Firmas y sellos internos que acrediten emisión por el transportista"

  red_flags:
    high_risk:
      - clue: "Cliente/destinatario no asociado a póliza ni a endoso vigente"
        why: "Sugiere intento de legitimar traslado para un tercero sin cobertura"
      - clue: "Operador o placas distintos a los asentados en denuncias o carpeta"
        why: "Indica posible simulación o sustitución de unidades"
    medium:
      - clue: "Fecha de emisión fuera de la ventana del recorrido denunciado"
        why: "Debilita la trazabilidad del siniestro y la cobertura"
      - clue: "Firmas o sellos ausentes en campos obligatorios"
        why: "Reduce confianza en la autenticidad del formato"

response_template:
  output_format:
    documento_analizado: "carta_porte_simple"
    analisis_completo: |
      Se cuenta con Carta Porte Simple con folio {folio}, emitida por {empresa_transportista}, con fecha {fecha_emision_formateada}; se detalla el traslado de {categoria_mercancia} desde {origen} hacia {destino}, consignado a {cliente}. El operador identificado es {operador} y se declara la unidad con placas {placas}. Resumir si la información concuerda con denuncias, póliza y soportes logísticos.
    risk_level: "bajo|medio|alto|critico"
    fraud_score: 0.0
    confidence: 0.0
    indicators: []
    recommendations: []

    integridad_documental:
      folio_interno: ""
      remitente: ""
      destinatario: ""
      firmas_presentes: []
      observaciones: ""

    logistica_transporte:
      descripcion_mercancia: ""
      cantidad: 0
      peso_total: 0.0
      volumen_total: 0.0
      capacidad_vs_peso: "pendiente"
      ruta:
        origen: ""
        destino: ""
        puntos_intermedios: []
      vehiculo:
        placas: ""
        caracteristicas: ""
        capacidad: ""
      operador:
        nombre: ""
        licencia: ""
        permisos_sct: ""
        vigencia_permisos: ""

    validacion_cruzada:
      carta_porte:
        categoria_bienes: ""
        cliente_normalizado: ""
        operadores_relacionados: []
        placas_declaradas: []
        observaciones: ""

    validation_tasks:
      - tarea: "Confirmar en póliza y endosos la legitimación del destinatario/cliente citado."
        fuente: "Póliza vigente y endosos"
        prioridad: "alta"
        estado: "pendiente"
      - tarea: "Cotejar fecha/hora de emisión con denuncias y registros GPS del recorrido."
        fuente: "Denuncia de los hechos / reporte GPS"
        prioridad: "alta"
        estado: "pendiente"
      - tarea: "Validar operador y placas contra denuncias y carpeta de investigación."
        fuente: "Carpeta de investigación / denuncia"
        prioridad: "alta"
        estado: "pendiente"
