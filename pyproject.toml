[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-scorer"
version = "2.0.0"  
description = "Sistema empresarial para detectar fraude en siniestros combinando OCR y LLMs."
authors = [
  { name = "Leo Guirao", email = "guiraoleo.2000@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    # ---- Núcleo de la App y API ----
    "fastapi",
    "uvicorn",
    "pydantic",
    "streamlit",
    
    # ---- Inteligencia Artificial y LLMs ----
    "torch",
    "transformers",
    "safetensors",
    "openai",
    "sentence-transformers",
    "numpy",
    "pandas",
    "scikit-learn",

    # ---- RAG y LangChain ----
    "langchain>=0.1.25",
    "langchain-community>=0.0.38",
    "langchain-openai>=0.1.7",
    "langchain-chroma>=0.2.6",
    "chromadb>=0.4.24",
    "unstructured[md]>=0.11.8",
    "tiktoken>=0.7.0",

    # ---- Procesamiento de Documentos y OCR ----
    "azure-ai-formrecognizer",
    "pypdf",
    "pymupdf",
    "pdfplumber",
    "pypdfium2",
    "camelot-py[cv]",
    "tabula-py",
    "pdf2image",
    "weasyprint",
    "pyarrow",
    "zstandard",
    "pyproj",
    "h3",
    "orjson",
    
    # ---- Bases de Datos y Almacenamiento ----
    "sqlalchemy",
    "alembic",
    "redis",
    "minio",
    "asyncpg", # Driver para PostgreSQL usado por SQLAlchemy

    # ---- Utilidades Generales ----
    "python-dotenv",
    "requests",
    "httpx",
    "rapidfuzz"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
